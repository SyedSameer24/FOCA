[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "foca-cli"
version = "2.4.0"
description = "FOCA CLI: Metadata & Full Organizational OSINT Suite"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "rich>=13.0.0",
    "requests>=2.28.0",
    "PyMuPDF>=1.22.0",
    "PyPDF2>=3.0.0",
    "pillow>=10.0.0",
    "pydantic>=2.0.0",
    "defusedxml>=0.7.0",
    "dnspython>=2.0.0",
]

[project.scripts]
foca = "main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["foca_core*"]
